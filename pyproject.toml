[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-memory-lite"
version = "0.1.0.dev0"
description = "Portable repository and Markdown vault binding for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
uaml = "uaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
